<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Your Brand</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="container">
    <h1 class="logo"><img src="images/apes-logo-horiz.svg" style="width: 100px"></h1>
    <div class="nav-right">
      <div class="language-selector">
        <button class="language-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l.15-.15C9.66 15.66 10.32 15 11 15s1.34.66 1.85 1.85L13 17v-2h-3v2zm6-5H7v-2h9v2z"/>
          </svg>
          <span id="current-lang">EN</span>
        </button>
        <div class="dropdown-content">
          <a href="#" data-lang="en">English</a>
          <a href="#" data-lang="es">Español</a>
        </div>
      </div>
      <nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="projects.html" data-i18n="nav.projects">Projects</a>
        <a href="about.html" data-i18n="nav.about">About</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>
    </div>
  </div>
</header>

<section class="container" style="padding:80px 0; max-width:600px;">
  <h2 style="text-align:center; margin-bottom:40px;" data-i18n="contact.title">Contact</h2>

  <form>
    <input type="text" placeholder="Your Name" data-i18n-placeholder="contact.name" required style="width:100%; padding:10px; margin-bottom:15px;">
    
    <input type="email" placeholder="Your Email" data-i18n-placeholder="contact.email" required style="width:100%; padding:10px; margin-bottom:15px;">
    
    <textarea placeholder="Your Message" data-i18n-placeholder="contact.message" rows="5" required style="width:100%; padding:10px; margin-bottom:15px;"></textarea>
    
    <button type="submit" style="padding:10px 20px; background:white; color:black; border:none;" data-i18n="contact.send">
      Send Message
    </button>
  </form>
</section>

<footer>
  <p data-i18n="footer.copyright">© 2026 Your Brand</p>
</footer>

<script src="script.js"></script>
</body>
</html>
